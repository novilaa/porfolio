<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>mockup2</title>
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:900px;overflow:hidden}
body{background:linear-gradient(160deg,var(--c2),var(--c1));position:relative}
.ph{position:absolute;left:56px;top:132px;width:310px;aspect-ratio:390/800;padding:7px;border-radius:15.7%/7.7%;
 background:linear-gradient(145deg,#6c6a66,#2b2a28 18%,#4a4845 50%,#232220 82%,#5e5c58);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 40px 60px -24px rgba(0,0,0,.45),0 14px 24px -10px rgba(0,0,0,.25)}
.sc{position:relative;width:100%;height:100%;overflow:hidden;border-radius:14.4%/7%;background:#000}
.sc::before{content:"";position:absolute;z-index:3;top:1.6%;left:50%;width:29%;height:3.1%;transform:translateX(-50%);border-radius:99px;background:#000}
.sc::after{content:"";position:absolute;inset:0;z-index:3;border-radius:inherit;box-shadow:inset 0 0 0 2px #000;pointer-events:none}
.pn{position:absolute;top:60px;width:240px;height:780px;overflow:hidden;border-radius:10px;background:#fff;
 box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 18px 40px -18px var(--sh),0 4px 10px -4px var(--sh)}
iframe{position:absolute;top:0;left:0;border:0;width:390px;transform-origin:0 0;background:#fff}
#p0{} #p1{left:404px} #p2{left:662px} #p3{left:920px}
</style></head><body>
<div class="ph" id="p0"><div class="sc"><iframe></iframe></div></div>
<div class="pn" id="p1"><iframe></iframe></div>
<div class="pn" id="p2"><iframe></iframe></div>
<div class="pn" id="p3"><iframe></iframe></div>
<script>
const q=new URLSearchParams(location.search), r=document.documentElement.style;
r.setProperty('--c1',q.get('c1'));r.setProperty('--c2',q.get('c2'));r.setProperty('--sh',q.get('c3'));
const url=q.get('d'), sc=q.get('s').split(';');
['p0','p1','p2','p3'].forEach((id,i)=>{
  const box=document.getElementById(id), f=box.querySelector('iframe'), host=i?box:box.querySelector('.sc');
  const k=host.clientWidth/390; f.style.transform='scale('+k+')'; f.style.height=(host.clientHeight/k)+'px';
  f.src='../'+url+'index.html';
  f.onload=()=>{ const w=f.contentWindow, d=f.contentDocument;
    d.querySelectorAll('.reveal').forEach(e=>e.classList.add('visible')); d.documentElement.style.scrollBehavior='auto'; d.body.style.scrollBehavior='auto';
    const tg=sc[i];
    const y=()=>/^\d+$/.test(tg)?+tg:d.querySelector(tg).getBoundingClientRect().top+w.scrollY-4;
    let t=0; const step=()=>{ const Y=y(); t=Math.min(Y,t+300); w.scrollTo(0,t); if(t<Y) setTimeout(step,250); else setTimeout(()=>w.scrollTo(0,Y),2500)}; setTimeout(step,300);
  };
});
</script></body></html>
